name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,build]"
      - name: Test
        run: pytest
      - name: Build OtpBridge.exe
        run: pyinstaller --noconfirm packaging/OtpBridge.spec
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/OtpBridge.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/OtpBridge.exe --title "$GITHUB_REF_NAME" --generate-notes
          fi
